services: 
  credentials:
    env_file: !override
      - ./configuration/sda/.env

auth: 
  extra_hosts: !reset null
  networks:
    -
  
postgres:
  extra_hosts: !reset null

download:
  extra_hosts: !reset null
  networks:
    -

s3inbox:
 extra_hosts: !reset null
 environment: 
    - SERVER_JWTPUBKEYURL=http://jwk-server/jwk.json
 depends_on:
    jwk-server:
      condition: service_started
 networks:
    -
  
sda-jwk-init:
  image: python:3.10-slim-bookworm
  container_name: sda_jwk_init
  depends_on:
    credentials:
      condition: service_completed_successfully
  volumes:
    - shared:/shared:ro
    - sda-jwk:/out
  entrypoint:
    - sh
    - -c
    - |
      set -e
      pip install --quiet --disable-pip-version-check joserfc
      python3 - <<'PY'
      import json
      from pathlib import Path
      from joserfc.jwk import ECKey

      key = ECKey.import_key(Path("/shared/keys/jwt.key").read_text())
      Path("/out/jwk.json").write_text(
          json.dumps({"keys": [key.as_dict(private=False)]})
      )
      print("wrote /out/jwk.json")
      PY
  networks:
    - secure
  restart: "no"